name: Draft module release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draft-module-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check module scripts
        run: |
          for script in module/*.sh; do sh -n "$script"; done
          node --test tools/test_rate_layout.js
          cargo fmt --manifest-path native/Cargo.toml -- --check
          cargo clippy --locked --all-targets --manifest-path native/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path native/Cargo.toml

      - name: Build Rust arm64 Android worker
        run: |
          rustup target add aarch64-linux-android
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          bash tools/build_native.sh

      - name: Build and verify both installable ZIPs
        id: package
        run: bash tools/package_module.sh "$GITHUB_SHA" --rust native/target/aarch64-linux-android/release/touch-listener

      - name: Create draft release with ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          SHELL_ASSET: ${{ steps.package.outputs.shell_asset }}
          RUST_ASSET: ${{ steps.package.outputs.rust_asset }}
        run: |
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          tags=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .ref")
          if [[ -n $releases || -n $tags ]]; then
            echo "::error::Release or tag $TAG already exists. Review the existing release or bump module.prop before running again."
            exit 1
          fi

          previous_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_SHA^" 2>/dev/null || true)
          if [[ -n $previous_tag ]]; then
            commits=$(git log --date=short --format='- %h (%ad) %s' "$previous_tag..$GITHUB_SHA" |
              sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          else
            commits=$(git log -10 --date=short --format='- %h (%ad) %s' "$GITHUB_SHA" |
              sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          fi
          [[ -n $commits ]] || commits='- No commit records found.'

          notes=$(printf '%s\n\n%s\n\n%s\n\n%s\n\n<pre>\n%s\n</pre>' \
            '**正式版**：模块会调用厂商触控 HAL 指令并修改系统运行状态，升级前请先备份当前可用版本。' \
            '作者：FIOIU8' \
            "Install \`$(basename "$SHELL_ASSET")\` for the Shell backend, or \`$(basename "$RUST_ASSET")\` for the Rust backend (arm64-v8a only). The two packages are independent; install only one." \
            '## Git commits' "$commits")
          release_url=$(gh release create "$TAG" "$SHELL_ASSET" "$RUST_ASSET" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "ColorOSDynamic $TAG（正式版）" \
            --notes "$notes")
          printf 'Draft release: %s\n\nShell: `%s`\nRust: `%s`\n\n### Git commits\n\n<pre>\n%s\n</pre>\n' \
            "$release_url" "$(basename "$SHELL_ASSET")" "$(basename "$RUST_ASSET")" "$commits" >> "$GITHUB_STEP_SUMMARY"

name: Draft module release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draft-module-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check module scripts
        run: |
          for script in module/*.sh; do sh -n "$script"; done
          node --test tools/test_rate_layout.js
          cargo fmt --manifest-path native/Cargo.toml -- --check
          cargo clippy --locked --all-targets --manifest-path native/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path native/Cargo.toml

      - name: Build experimental arm64 Android worker
        run: |
          rustup target add aarch64-linux-android
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          bash tools/build_native.sh

      - name: Build and verify both installable ZIPs
        id: package
        run: bash tools/package_module.sh "$GITHUB_SHA" --experimental native/target/aarch64-linux-android/release/touch-listener

      - name: Create draft release with ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          ASSET: ${{ steps.package.outputs.asset }}
          EXPERIMENTAL_ASSET: ${{ steps.package.outputs.experimental_asset }}
        run: |
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          tags=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .ref")
          if [[ -n $releases || -n $tags ]]; then
            echo "::error::Release or tag $TAG already exists. Review the existing release or bump module.prop before running again."
            exit 1
          fi

          notes=$(printf '%s\n\n%s\n\n%s' \
            '**非正式版（Unofficial）**：可能随时改动或撤回，不保证稳定性。' \
            '作者：FIOIU8' \
            "Install \`$(basename "$ASSET")\` from Assets in your module manager. The optional arm64 test ZIP lets you select the Rust listener in WebUI.")
          release_url=$(gh release create "$TAG" "$ASSET" "$EXPERIMENTAL_ASSET" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title "ColorOSDynamic $TAG（非正式版）" \
            --notes "$notes")
          printf 'Draft release: %s\n\nInstaller: \`%s\`\n' "$release_url" "$(basename "$ASSET")" >> "$GITHUB_STEP_SUMMARY"

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7faf6">
  <meta name="color-scheme" content="light dark">
  <title>ColorOS Touch</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark" aria-hidden="true"></span><span>ColorOS <b>Touch</b></span></div>
    <button id="preferences" class="icon-button" type="button" data-label="preferences" aria-label="界面设置"><span class="symbol settings-icon" aria-hidden="true"></span></button>
  </header>
  <main>
    <section id="overview" aria-labelledby="overview-title">
      <div class="page-heading">
        <h1 id="overview-title" data-i="overview">概览</h1>
        <span class="state" id="state" data-state="loading" role="status">加载中</span>
      </div>
      <div class="telemetry">
        <div class="telemetry-content">
          <div class="hero-art" aria-hidden="true"></div>
          <div class="hero-top">
            <span data-i="applied">最近成功下发</span>
            <label class="switch"><input id="enabled" type="checkbox" role="switch" data-label="enable" aria-label="启用触控优化" disabled><span></span></label>
          </div>
          <div class="rate"><strong id="applied">—</strong><span>Hz</span></div>
        </div>
        <div class="hero-bottom">
          <div><span data-i="target">目标档</span><b id="target">—</b></div>
          <div><span data-i="global">全局档</span><b id="global">—</b></div>
        </div>
      </div>
      <div class="info-panel foreground">
        <div class="app-glyph" aria-hidden="true"><span class="symbol app-icon"></span></div>
        <div><small data-i="foreground">前台应用</small><strong id="foreground">—</strong><span id="package" class="mono"></span></div>
      </div>
      <div id="shortcuts" class="quick-actions"></div>
    </section>

    <section id="rules" aria-labelledby="rules-title" hidden>
      <div class="page-heading"><h1 id="rules-title" data-i="rules">规则</h1><span id="rule-count" class="count"></span></div>
      <div class="info-panel global-control"><label for="global-rate" data-i="global">全局档</label><select id="global-rate" disabled></select></div>
      <div class="rules-block">
        <label class="search"><span class="symbol search-icon" aria-hidden="true"></span><input id="search" type="search" data-placeholder="search" data-label="search" placeholder="搜索应用或包名"></label>
        <div id="rule-list" class="rule-list"></div>
        <button id="add-rule" class="add" type="button"><span class="symbol plus-icon" aria-hidden="true"></span><span data-i="addRule">新增规则</span></button>
      </div>
      <details id="advanced" class="advanced">
        <summary data-i="advanced">高级设置</summary>
        <div class="advanced-body">
          <label for="rates-text" data-i="mappings">触控命令映射</label>
          <textarea id="rates-text" rows="6" spellcheck="false" dir="ltr"></textarea>
          <label class="check-row"><input type="checkbox" id="fallback-enabled"><span data-i="fallback">为指定应用加强校准</span></label>
          <label for="fallback-items" data-i="watchlist">应用包名（每行一个）</label>
          <textarea id="fallback-items" rows="3" spellcheck="false" dir="ltr"></textarea>
          <label class="inline" for="poll-interval"><span data-i="interval">校准间隔（秒）</span><input id="poll-interval" type="number" min="1" max="60"></label>
          <div class="inline"><span data-i="shortcuts">概览快捷操作</span><div id="shortcut-selects" class="shortcut-selects"></div></div>
        </div>
      </details>
      <div id="save-bar" class="save-bar" hidden><span data-i="unsaved">有未保存的修改</span><button id="discard" class="quiet" type="button" data-i="discard">撤销</button><button id="save" class="primary" type="button" data-i="save">保存</button></div>
    </section>

    <section id="diagnostics" aria-labelledby="diagnostics-title" hidden>
      <div class="page-heading"><h1 id="diagnostics-title" data-i="diagnostics">诊断</h1></div>
      <dl class="diagnostics info-panel" id="details"></dl>
      <div class="actions connected"><button id="resync" class="primary" type="button" data-i="resync">重新检测</button><button id="refresh" type="button" data-i="refresh">刷新状态</button></div>
      <div class="log-panel">
        <div class="log-title"><h2 data-i="logs">运行日志</h2><button id="load-logs" class="quiet" type="button" data-i="loadLogs">查看</button><button id="copy-logs" class="quiet" type="button" data-i="copy" disabled>复制</button></div>
        <pre id="log-output" tabindex="0" data-i="logEmpty">日志按需读取</pre>
      </div>
    </section>
    <p id="message" class="message" role="status" hidden></p>
  </main>

  <nav class="tabbar" data-label="nav" aria-label="主导航">
    <button type="button" data-page="overview" aria-current="page">
      <span class="tab-indicator" aria-hidden="true">
        <svg class="tab-icon" viewBox="0 0 24 24" focusable="false">
          <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
          <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        </svg>
      </span>
      <span data-i="overview">概览</span>
    </button>
    <button type="button" data-page="rules">
      <span class="tab-indicator" aria-hidden="true">
        <svg class="tab-icon" viewBox="0 0 24 24" focusable="false">
          <path d="m3 17 2 2 4-4m-6-8 2 2 4-4M13 6h8m-8 6h8m-8 6h8"/>
        </svg>
      </span>
      <span data-i="rules">规则</span>
    </button>
    <button type="button" data-page="diagnostics">
      <span class="tab-indicator" aria-hidden="true">
        <svg class="tab-icon" viewBox="0 0 24 24" focusable="false">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
      </span>
      <span data-i="diagnostics">诊断</span>
    </button>
  </nav>
  <dialog id="prefs-dialog">
    <form method="dialog" class="dialog-content">
      <h2 data-i="preferences">界面设置</h2>
      <div class="inline"><label for="theme" data-i="theme">主题</label><select id="theme"><option value="system" data-i="system">系统</option><option value="light" data-i="light">浅色</option><option value="dark" data-i="dark">深色</option></select></div>
      <div class="inline"><label for="language" data-i="language">语言</label><select id="language"><option value="system" data-i="system">系统</option><option value="zh">简体中文</option><option value="en">English</option></select></div>
      <button class="primary" value="done" data-i="done">完成</button>
    </form>
  </dialog>
  <dialog id="rule-dialog">
    <form id="rule-form" class="dialog-content">
      <h2 data-i="newRule">新增应用规则</h2>
      <label id="app-input-label" for="app-input" data-i="packageName">应用包名</label>
      <div id="app-picker" class="app-picker">
        <div class="app-picker-field">
          <input id="app-input" role="combobox" aria-autocomplete="list" aria-controls="installed-apps" aria-expanded="false" required autocomplete="off" autocapitalize="none" spellcheck="false" pattern="[A-Za-z0-9_]+(\.[A-Za-z0-9_]+)+" placeholder="com.example.app">
          <button id="app-list-toggle" class="app-list-toggle" type="button" tabindex="-1" aria-controls="installed-apps" aria-expanded="false" aria-label="已安装应用" data-label="installedApps"></button>
        </div>
        <div id="installed-apps" class="app-suggestions" role="listbox" aria-labelledby="app-input-label" tabindex="-1" hidden></div>
      </div>
      <label for="app-rate" data-i="target">目标档</label><select id="app-rate"></select>
      <div class="actions"><button id="cancel-rule" type="button" data-i="cancel">取消</button><button class="primary" type="submit" data-i="add">添加</button></div>
    </form>
  </dialog>
  <dialog id="confirm-dialog">
    <form method="dialog" class="dialog-content"><h2 data-i="unsaved">有未保存的修改</h2><p data-i="leavePrompt">离开此页前，保存或放弃修改。</p>
      <div class="actions"><button value="cancel" data-i="cancel">取消</button><button value="discard" data-i="discard">撤销</button><button value="save" class="primary" data-i="save">保存</button></div>
    </form>
  </dialog>
  <dialog id="dropdown-menu" class="dropdown-menu"><div id="dropdown-options" role="listbox"></div></dialog>
</body>
</html>
